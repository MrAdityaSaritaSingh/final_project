services:
  - type: web
    name: audit-ledger-backend
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB_NAME
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: "https://audit-ledger-scrutiny.vercel.app,https://www.audit-ledger-scrutiny.vercel.app,http://localhost:3000,http://localhost:5173"
    healthCheckPath: /docs
